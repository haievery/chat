
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no" />
    <title>修改密码</title>
    <script src="/js/mui.min.js"></script>
    <script src="/js/jfs.js" type="text/javascript" charset="utf-8"></script>
    <script src="/js/angular.min.js" type="text/javascript" charset="utf-8"></script>
    <link rel="stylesheet" href="/Content/mui/css/mui.min.css" />
    <link rel="stylesheet" href="/Content/site/com-mui.css" />
</head>
<body>
    <header class="mui-bar mui-bar-nav">
        <a class="mui-action-back mui-icon mui-icon-left-nav mui-pull-left"></a>
        <h1 class="mui-title">修改密码</h1>
    </header>
    <div class="mui-content">
        <div class="mui-card jfs-form" jfs-posturl="/allin/user/ModiPassword" jfs-form-okmsg="密码修改成功!">
            <div class="mui-card-header">
                修改登录密码
            </div>
            <div class="mui-card-content">
                <div class="mui-table-view">
                    <div class="mui-input-row">
                        <label>原密码</label>
                        <input jfs-id='oldpassword' type="password" class="mui-input-clear mui-input mui-input-password" placeholder="原来的登录密码">
                    </div>
                    <div class="mui-input-row">
                        <label>新密码</label>
                        <input jfs-id='newpassword' type="password" class="mui-input-clear mui-input mui-input-password" placeholder="新的登录密码">
                    </div>
                    <div class="mui-input-row">
                        <label>确认新密码</label>
                        <input jfs-id='newpassword2' type="password" class="mui-input-clear mui-input mui-input-password" placeholder="与上面输入的一致">
                    </div>
                </div>
            </div>
           <div class="mui-card-footer">
               <button class="mui-btn mui-btn-primary jfs-submit">修 改</button>
           </div>
        </div>
        <div class="mui-card jfs-form" jfs-posturl="/allin/user/ModiTradePassword" jfs-form-okmsg="交易密码修改成功!">
            <div class="mui-card-header">
                修改交易密码
            </div>
            <div class="mui-card-content">
                <div class="mui-table-view">
                    <div class="mui-input-row">
                        <label>原密码</label>
                        <input jfs-id='oldpassword' type="password" class="mui-input-clear mui-input mui-input-password" placeholder="原来的交易密码">
                    </div>
                    <div class="mui-input-row">
                        <label>新密码</label>
                        <input jfs-id='newpassword' type="password" class="mui-input-clear mui-input mui-input-password" placeholder="新的交易密码">
                    </div>
                    <div class="mui-input-row">
                        <label>确认新密码</label>
                        <input jfs-id='newpassword2' type="password" class="mui-input-clear mui-input mui-input-password" placeholder="与上面输入的一致">
                    </div>
                </div>
            </div>
            <div class="mui-card-footer">
                <button class="mui-btn mui-btn-primary jfs-submit">修 改</button>
            </div>
        </div>

    </div>
    <script>
        mui.init();
    </script>
    <script src="/js/jfs.form.js"></script>
</body>
</html>
