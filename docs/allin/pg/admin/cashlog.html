<ul class="com-toolbar" com-auto="list">
    <li>
        信息 <input name="key" />
    </li>
    <li>
        <input name="end" class="copy com-datetime" value="" placeholder="年-月-日" />

    </li>
    <li>
        <button class="mui-btn  mui-btn-link mui-icon mui-icon-search" com-auto com-post>查询</button>
    </li>
</ul>
<div class="mui-scroll-wrapper">
    <div class="mui-scroll" pull>
        <div id="list" class="com-auto" com-refresh="" com-autoload="false" com-load="/allin/user/ProcessCmd/admincashlog">
            <table class="com-table">
                <thead>
                    <tr>
                        <td style="width:180px;">时间</td>
                        <td>处理人</td>
                        <td>信息</td>
                        <td style="text-align:right;">变化金额</td>
                    </tr>
                </thead>
                <tr com-foreach="item in data">
                    <td>{{item.LogTime:datetime}}</td>
                    <td>{{item.OperatorName}}</td>
                    <td style="text-align:left;">{{item.Title}}</td>
                    <td style="text-align:right;" title="(原){{item.OldData}} » (新){{item.NewData}}">{{item.AddData}}<p class="hide800">{{item.OldData}} »{{item.NewData}}</p></td>
                </tr>
            </table>

        </div>
    </div>
</div>
