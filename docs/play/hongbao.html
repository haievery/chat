<!DOCTYPE html>
<html>

	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no" />
		<title>红包厅 - 集分所</title>
		<script src="/js/mui.min.js"></script>
        <link rel="stylesheet" href="/Content/mui/css/mui.min.css" />
        <link rel="stylesheet" href="/Content/site/com-mui.css" />
        <script src="/js/jfs.js" type="text/javascript" charset="utf-8"></script>
		<script src="/js/common.js"></script>
		<style type="text/css">
			.mui-table h4,
			.mui-table h5,
			.mui-table .mui-h5,
			.mui-table .mui-h6,
			.mui-table p {
				margin-top: 0;
			}
			
			.mui-table h4 {
				line-height: 21px;
				font-weight: 500;
			}
			
			.mui-table .oa-icon {
				position: absolute;
				right: 0;
				bottom: 0;
			}
			
			.mui-table .oa-icon-star-filled {
				color: #f14e41;
			}
		</style>

	</head>

	<body ng-app="hbApp">
		<div class="mui-content" style="background:url(images/hb_bg.png) repeat;" ng-controller="hbController">
			<div style="margin:0px;pading:10px;width:100%;height:260px;background:url(images/hb_head_bg.png); background-size:100% 100%;">
				<a class="mui-action-back mui-icon mui-icon-close mui-pull-right"></a>
				<div style="padding:14px 10px; font-size:16px;color:#FFF; line-height:28px;text-align: center;">
                    红包大厅一批红包待您领取
					<p>
					<span class="mui-h2" style="color:#FFF;" ng-bind="hb.total"></span>个
					</p>
					<!--如果可领取的红包个数小于4，每6个小时就会增加1个红包;您还可以发红包，每发一次红包，可以多领1个红包。-->
				</div>
				<div style="width:100%;height:70px; margin:50px auto 0px auto;text-align:center;">
					<button type="button" class="mui-btn mui-btn-warning" style="margin-right:80px;" ng-click="getHb();">
					领红包<span class="mui-badge mui-badge-danger" ng-bind="hb.count"></span>
				</button>
					<button type="button" class="mui-btn mui-btn-warning" style="margin-left:80px;" ng-click="sendHb();">
					发红包
				</button>
				</div>
			</div>

			<ul class="mui-table-view mui-table-view-striped mui-table-view-condensed" style="margin-top:-50px;">
				<li class="mui-table-view-cell" ng-repeat="luck in hb.lucks">
					<div class="mui-table">
						<div class="mui-table-cell mui-col-xs-8">
							<h4 class="mui-ellipsis" ng-bind="luck.Title"></h4>
							<p class="mui-h6 mui-ellipsis">施主:{{luck.CreatorName}}
								<span ng-if="luck.State>0">已领取</span>
								<span ng-if="luck.State==0">待领取</span></p>
						</div>
						<div class="mui-table-cell mui-col-xs-4 mui-text-right"> 
							<span class="mui-h3" ng-bind="luck.Value"></span><span class="mui-h5">积分</span>
						</div>
					</div>
		
				</li>
				<li class="mui-table-view-cell">
									<div class="mui-table" style="text-align: center;">
				
						<div class="mui-table-cell mui-col-xs-12"> 
							以上为系统2日内20个较大的红包
						</div>
					  </div>
				</li>

			</ul>

			<div style="margin-top:-120px;pading:0px;width:100%;height:180px;background:url(images/hb_bottom_bg.png); background-size:100% 100%;">

			</div>

		</div>
		<script src="/js/angular.min.js" type="text/javascript" charset="utf-8"></script>
		<script type="text/javascript">
			mui.init();
			angular.module("hbApp", []).controller("hbController", function($scope, $http) {
				$scope.flush = function() {
//					jfs.ajax("/allin/Sys/Hongbao",null,function(back){
//						alert("ok");
//						$scope.hb=back.data;
//					});  
					$http({
						method: "POST",
						url: jfs.vipurl + "/allin/Sys/Hongbao"
					}).success(function(data, status) {
						$scope.hb = data.data;
					});
				};
				$scope.sendHb=function(){
					openPage("fahongbao.html",true,null,null,$scope.flush);
				};
			
				$scope.getHb=function(){
							//刷新
							jfs.ajax("/allin/Sys/LingHongbao", null, function(back) {
								mui.alert("恭喜您！" + back.msg);
									setTimeout(function() {
								var appElement = document.querySelector('[ng-controller=hbController]');
								var $s = angular.element(appElement).scope();
								$s.flush();
								$s.$digest();
							}, 10);
							});
						
				};
				$scope.flush();
			});
		</script>
	</body>

</html>
